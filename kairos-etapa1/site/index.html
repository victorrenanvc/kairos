<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kairós">
<meta name="theme-color" content="#0A0A0A">
<title>Kairós · GC Dínamus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0A;--paper:#EFEEE9;--lime:#C8F031;--red:#E8341C;--muted:#525252;--line:#C9C6BC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.tela{padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 110px);display:flex;flex-direction:column;gap:14px}
.tela.sem-nav{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.mono-s{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.display{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:.9;margin:0}
.lime{color:var(--lime)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.btn{height:48px;border:0;padding:0 16px;font:800 14px Archivo,sans-serif;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);background:transparent}
.btn:disabled{opacity:.5}
button,a.btn,label.btn,.assento,.cartao{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,filter .12s ease}
button:active,a.btn:active,label.btn:active{transform:scale(.95);filter:brightness(.9)}
.esperando{position:relative;pointer-events:none;overflow:hidden}
.esperando::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:brilho .9s linear infinite}
@keyframes brilho{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes pulo{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.feito{animation:pulo .35s ease}
#puxar{white-space:nowrap;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translate(-50%,-80px);z-index:8;background:var(--ink);color:var(--lime);font:600 12px 'IBM Plex Mono',monospace;padding:10px 14px;display:flex;align-items:center;gap:8px;transition:transform .2s ease}
#puxar.on{transform:translate(-50%,0)}
#puxar svg{animation:none}
#puxar.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--lime)}
.btn-line{background:transparent;border:2px solid currentColor}
.btn-sq{width:44px;height:44px;padding:0}
.btn-p{height:38px;padding:0 12px;font-size:12px}
.grow{flex:1}
.campo{display:flex;flex-direction:column;gap:5px}
.campo input,.campo select,select.sel{height:48px;border:2px solid var(--ink);background:#fff;padding:0 12px;font-size:16px;border-radius:0;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
textarea.txt{border:2px solid var(--ink);background:#fff;padding:10px 12px;font-size:16px;line-height:1.4;border-radius:0;width:100%;resize:vertical;min-height:84px;-webkit-appearance:none}
.bloco-preto textarea.txt{background:#151515;color:#fff;border-color:#fff}
.bloco-preto{background:var(--ink);color:#fff;padding:16px;display:flex;flex-direction:column;gap:10px}
.dots{background-image:radial-gradient(rgba(200,240,49,.10) 1px,transparent 1.2px);background-size:8px 8px}
.caixa{border:2px solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cartao{background:#fff;border:2px solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sticker{display:inline-block;padding:6px 9px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600}
.lista-linha{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line);padding:6px 0}
.tag{padding:5px 8px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;white-space:nowrap}
.assentos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.assento{height:44px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;border:0;padding:0;overflow:hidden}
.assento img{width:100%;height:100%;object-fit:cover;display:block}
.a-sim{background:var(--lime);color:var(--ink)}
.a-sim img{outline:3px solid var(--lime);outline-offset:-3px}
.a-vazio{border:1.5px dashed #737373;color:#A3A3A3;background:transparent}
.a-vazio img{opacity:.45}
.a-nao{border:1.5px solid #404040;color:#737373;text-decoration:line-through;background:transparent}
.a-nao img{opacity:.25;filter:grayscale(1)}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--ink);color:var(--lime);font-family:'IBM Plex Mono',monospace;font-weight:600;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.abas{display:flex;gap:18px;border-bottom:2px solid var(--ink)}
.abas button{background:transparent;border:0;padding:8px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;min-height:40px}
.abas button.ativo{color:var(--ink);border-bottom-color:var(--ink)}
.selo{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:21px}
.selo.tem{background:var(--ink);color:var(--lime)}
.selo.falta{border:2px dashed #8A877E;color:#737066}
nav.menu{position:fixed;left:0;right:0;bottom:0;z-index:5}
nav.menu .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--ink)}
nav.menu button{background:transparent;border:0;color:#D4D4D4;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600}
nav.menu button.ativo{background:var(--lime);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--lime);padding:12px 16px;font:600 13px 'IBM Plex Mono',monospace;max-width:90vw;z-index:9;display:none}
.carregando{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--ink)}
.erro{background:var(--red);color:#fff;padding:10px 12px;font-weight:700;font-size:14px}
.sublinhado{position:relative;display:inline-block}
.sublinhado svg{position:absolute;left:0;bottom:-10px;width:100%;height:18px}
.lider-tela{background:var(--lime);min-height:100dvh}
.barra{height:10px;background:#E4E2DA}
.barra>span{display:block;height:100%;background:var(--ink)}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="puxar" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span>Solte para atualizar</span></div>
<script>
(function () {
  'use strict';
  var API = window.KAIROS_API || '';
  var DIAS = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
  var DIAS_LONGO = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  var MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  var MESES_LONGO = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var S = {
    token: guardar('kairos_token'),
    tela: 'inicio',
    dados: null,
    nomes: null,
    fotos: lerJSON('kairos_fotos') || {},
    perfil: null,
    perfilId: '',
    editando: false,
    abaOracao: 'pedidos',
    novoPedido: false,
    respondendo: '',
    rasc: {},
    codigo: null,
    erro: '',
    ocupado: false,
    cad: { casado: 'nao' },
    modo: 'entrar'
  };
  var app = document.getElementById('app');

  /* ---------- utilidades ---------- */
  function guardar(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k) || '';
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    } catch (e) { return ''; }
  }
  function lerJSON(k) { try { return JSON.parse(guardar(k) || 'null'); } catch (e) { return null; } }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 2800);
  }
  function api(acao, extra) {
    var corpo = Object.assign({ acao: acao, token: S.token }, extra || {});
    return fetch(API, { method: 'POST', body: JSON.stringify(corpo) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) {
          if (/^SESSAO/.test(j.erro)) { sair(true); }
          throw new Error(String(j.erro).replace(/^SESSAO:\s*/, ''));
        }
        return j.dados;
      }, function () { throw new Error('Sem conexão. Confira a internet e tente de novo.'); });
  }
  function sair(silencioso) {
    S.token = ''; guardar('kairos_token', null); S.dados = null; S.tela = 'inicio'; S.modo = 'entrar';
    if (!silencioso) render();
  }
  function plural(n, p, pl) { return n + ' ' + (n === 1 ? p : (pl || p + 's')); }
  function dataBR(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1]; }
  function diaSemana(iso) { var p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
  function saudacao() { var h = new Date().getHours(); return h < 12 ? 'bom dia' : (h < 18 ? 'boa tarde' : 'boa noite'); }
  function primeiroNome(n) { return String(n).trim().split(/\s+/)[0]; }
  function horaCurta(h) { var m = String(h || '').match(/(\d{1,2}):(\d{2})/); if (!m) return '20h'; return Number(m[1]) + 'h' + (m[2] === '00' ? '' : m[2]); }
  function dataTitulo(iso, hora) { var p = String(iso).split('-'); return DIAS_LONGO[diaSemana(iso)] + ' ' + p[2] + ' ' + MESES[Number(p[1]) - 1] + ' ' + p[0] + ' ' + horaCurta(hora); }
  function quando(iso) {
    if (!iso || !S.dados) return '';
    var h = S.dados.hoje, d = String(iso).slice(0, 10);
    if (d === h) return 'hoje';
    var dif = Math.round((Date.parse(h) - Date.parse(d)) / 86400000);
    if (dif === 1) return 'ontem';
    if (dif > 1 && dif < 7) return 'há ' + dif + ' dias';
    return dataBR(d);
  }
  function whats(num, texto) {
    var d = String(num || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.length <= 11) d = '55' + d;
    return 'https://wa.me/' + d + (texto ? '?text=' + encodeURIComponent(texto) : '');
  }
  function avatar(id, nome, tam, extra) {
    var f = S.fotos[id];
    var ini = String(nome || '').trim().split(/\s+/);
    var txt = ((ini[0] || '').charAt(0) + (ini.length > 1 ? ini[ini.length - 1].charAt(0) : '')).toUpperCase();
    return '<span class="av" style="width:' + tam + 'px;height:' + tam + 'px;font-size:' + Math.round(tam / 3.2) + 'px;' + (extra || '') + '">' +
      (f ? '<img src="' + esc(f) + '" alt="">' : esc(txt)) + '</span>';
  }

  var IC = {
    casa: '<path d="M3 11l9-7 9 7v10h-6v-6H9v6H3z"></path>',
    agenda: '<rect x="3" y="5" width="18" height="16"></rect><path d="M16 3v4M8 3v4M3 10h18"></path>',
    coracao: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path>',
    estrela: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path>',
    chama: '<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5"></path>',
    seta: '<path d="M7 17L17 7M8 7h9v9"></path>',
    voltar: '<path d="M15 18l-6-6 6-6"></path>',
    sino: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path>',
    atualizar: '<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path>',
    mais: '<path d="M12 4v16M4 12h16"></path>',
    msg: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"></path>',
    camera: '<path d="M3 8h4l2-3h6l2 3h4v12H3z"></path><circle cx="12" cy="13.5" r="3.5"></circle>',
    cadeado: '<rect x="5" y="11" width="14" height="10"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>'
  };
  function ic(nome, tam) {
    return '<svg width="' + (tam || 22) + '" height="' + (tam || 22) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true">' + IC[nome] + '</svg>';
  }
  var AMPULHETA = '<svg width="56" height="56" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#0A0A0A"/><rect x="136" y="96" width="240" height="28" fill="#C8F031"/><rect x="136" y="388" width="240" height="28" fill="#C8F031"/><path d="M160 124 L352 124 L268 256 L352 388 L160 388 L244 256 Z" fill="none" stroke="#C8F031" stroke-width="14"/><path d="M204 186 L308 186 L262 250 L250 250 Z" fill="#C8F031"/><rect x="253" y="256" width="6" height="92" fill="#C8F031"/><path d="M190 380 Q256 300 322 380 Z" fill="#C8F031"/></svg>';
  var RISCO = '<svg viewBox="0 0 170 20" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M3 12 C40 4, 90 18, 167 7" stroke="#E8341C" stroke-width="4" stroke-linecap="round"/></svg>';

  /* ---------- Acesso ---------- */
  function cabecalhoAcesso(titulo) {
    return '<div class="bloco-preto dots" style="margin:calc(-1 * (env(safe-area-inset-top) + 18px)) -18px 0;padding:calc(env(safe-area-inset-top) + 30px) 18px 18px">' +
      '<div class="between" style="align-items:flex-end"><div class="col" style="gap:6px"><span class="mono lime">GC Kairós · Dínamus</span>' +
      '<h1 class="display" style="font-size:52px">' + titulo + '</h1></div>' + AMPULHETA + '</div></div>';
  }
  function erroHtml() { return S.erro ? '<div class="erro" role="alert">' + esc(S.erro) + '</div>' : ''; }
  function ehIphoneSemInstalar() {
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    var inst = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    return ios && !inst;
  }
  function dicaInstalar() {
    if (!ehIphoneSemInstalar()) return '';
    return '<div class="caixa" style="background:var(--lime)"><span class="mono">Antes de entrar</span>' +
      '<span style="font-size:15px;font-weight:700;line-height:1.4">Instale o app: toque em <b>Compartilhar</b> (o quadrado com a seta) › <b>Adicionar à Tela de Início</b>. Depois abra pelo ícone da ampulheta e entre por lá. Assim você fica conectado de vez.</span></div>';
  }

  function telaSemConfig() {
    return '<div class="tela sem-nav">' + cabecalhoAcesso('Quase lá.') +
      '<p style="font-size:16px;font-weight:600;line-height:1.4">Falta colar o link do motor (Apps Script) no arquivo <b>config.js</b>.</p></div>';
  }

  function telaEntrar() {
    var nomes = S.nomes;
    var corpo;
    if (nomes === null) corpo = '<p class="mono">Carregando nomes…</p>';
    else if (!nomes.length) corpo = '<p style="font-size:16px;font-weight:600;line-height:1.4">Ninguém cadastrado ainda. O primeiro perfil criado vira o líder do GC.</p>' +
      erroHtml() + '<button class="btn btn-ink" data-acao="ir-cadastro">Criar o primeiro perfil</button>';
    else corpo = '<form data-form="entrar" class="col" style="gap:12px">' +
      '<label class="campo"><span class="mono">Quem é você?</span><select name="id" required><option value="">Escolha seu nome</option>' +
      nomes.map(function (n) { return '<option value="' + esc(n.id) + '"' + (guardar('kairos_ultimo') === n.id ? ' selected' : '') + '>' + esc(n.nome) + '</option>'; }).join('') +
      '</select></label>' +
      '<label class="campo"><span class="mono">Seu código de 4 números</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required style="font-size:22px;letter-spacing:.4em"></label>' +
      erroHtml() +
      '<button class="btn btn-ink" type="submit"' + (S.ocupado ? ' disabled' : '') + '>' + (S.ocupado ? 'Entrando…' : 'Entrar') + '</button>' +
      '<span class="mono-s muted">Esqueceu o código? Peça um novo ao líder.</span></form>' +
      '<div class="between" style="border-top:2px solid var(--ink);padding-top:14px"><span style="font-weight:700">Primeira vez aqui?</span>' +
      '<button class="btn btn-line" data-acao="ir-cadastro">Criar perfil</button></div>';
    return '<div class="tela sem-nav">' + cabecalhoAcesso('Bem-vindo<br>de volta.') + dicaInstalar() + corpo + '</div>';
  }

  function telaCadastro() {
    var c = S.cad;
    var conjuges = (S.nomes || []).filter(function (n) { return !n.conjuge_id; });
    return '<div class="tela sem-nav">' + cabecalhoAcesso('Puxa uma<br>cadeira.') + dicaInstalar() +
      '<form data-form="cadastro" class="col" style="gap:12px">' +
      '<label class="campo"><span class="mono">Nome e sobrenome</span><input name="nome" autocomplete="name" maxlength="60" required value="' + esc(c.nome) + '"></label>' +
      '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' +
      '<label class="campo"><span class="mono">WhatsApp</span><input name="whatsapp" type="tel" autocomplete="tel" placeholder="(62) 9…" value="' + esc(c.whatsapp) + '"></label>' +
      '<label class="campo"><span class="mono">Aniversário</span><input name="aniversario" inputmode="numeric" placeholder="DD/MM" maxlength="5" data-mascara="ddmm" value="' + esc(c.aniversario) + '"></label></div>' +
      '<div class="campo"><span class="mono">Você é</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' +
      [['h', 'Homem'], ['m', 'Mulher']].map(function (o) {
        var on = c.genero === o[0];
        return '<button type="button" class="btn ' + (on ? 'btn-lime' : '') + '" style="border:2px solid var(--ink);' + (on ? '' : 'background:#fff') + '" data-acao="genero-cad" data-v="' + o[0] + '" aria-pressed="' + on + '">' + o[1] + '</button>';
      }).join('') + '</div><span class="mono-s muted">Para as duplas de oração: homens com homens, mulheres com mulheres.</span></div>' +
      '<div class="campo"><span class="mono">Você é casado(a)?</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' +
      ['sim', 'nao'].map(function (v) {
        var on = c.casado === v;
        return '<button type="button" class="btn ' + (on ? 'btn-lime' : '') + '" style="border:2px solid var(--ink);' + (on ? '' : 'background:#fff') + '" data-acao="casado" data-v="' + v + '" aria-pressed="' + on + '">' + (v === 'sim' ? 'Sim' : 'Não') + '</button>';
      }).join('') + '</div></div>' +
      (c.casado === 'sim' ? '<label class="campo"><span class="mono">Seu cônjuge</span><select name="conjugeId"><option value="">Ainda não tem perfil</option>' +
        conjuges.map(function (n) { return '<option value="' + esc(n.id) + '"' + (c.conjugeId === n.id ? ' selected' : '') + '>' + esc(n.nome) + '</option>'; }).join('') + '</select></label>' : '') +
      '<label class="campo"><span class="mono">Crie um código de 4 números</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required style="font-size:22px;letter-spacing:.4em"></label>' +
      '<span class="mono-s muted">Anote o código: é com ele que você entra.</span>' +
      erroHtml() +
      '<button class="btn btn-ink" type="submit" style="height:52px"' + (S.ocupado ? ' disabled' : '') + '>' + (S.ocupado ? 'Enviando…' : 'Criar meu perfil') + '</button>' +
      '<span class="mono-s" style="text-align:center">O líder aprova sua entrada no grupo.</span></form>' +
      '<button class="btn" style="text-transform:none;font-weight:700" data-acao="ir-entrar">Já tenho perfil · Entrar</button></div>';
  }

  function telaAguardando() {
    return '<div class="tela sem-nav">' + cabecalhoAcesso('Pedido<br>enviado.') +
      '<p style="font-size:17px;font-weight:600;line-height:1.45">Agora é só esperar o líder aprovar. Depois, volte aqui, escolha seu nome e entre com o seu código.</p>' +
      '<button class="btn btn-ink" data-acao="ir-entrar">Ir para entrar</button></div>';
  }

  /* ---------- Início ---------- */
  function resumoEncontro(d) {
    var vai = d.presenca.lista.filter(function (x) { return x.resposta === 'sim'; }).length;
    var meu = d.papeis.filter(function (p) { return p.meu; })[0];
    return { dia: diaSemana(d.encontro.data), vai: vai, meu: meu };
  }

  function botoesPresenca(d, escuro) {
    var m = d.presenca.minha;
    var cor = escuro ? '#fff' : 'var(--ink)';
    return '<div class="row" style="gap:6px">' +
      '<button class="btn grow ' + (m === 'sim' ? 'btn-lime' : '') + '" style="' + (m === 'sim' ? '' : 'border:2px solid ' + cor + ';color:' + cor) + '" data-acao="presenca" data-v="sim" aria-pressed="' + (m === 'sim') + '">' + (m === 'sim' ? 'Tô dentro ✓' : 'Tô dentro') + '</button>' +
      '<button class="btn" style="' + (m === 'nao' ? 'background:var(--red);color:#fff' : 'border:2px solid ' + cor + ';color:' + cor) + '" data-acao="presenca" data-v="nao" aria-pressed="' + (m === 'nao') + '">Não vou poder</button></div>';
  }

  function telaInicio() {
    var d = S.dados, r = resumoEncontro(d);
    var pal = d.palavra, lei = d.leitura;
    var seq = lei.sequencia;
    var palavraHtml = pal ?
      '<p style="margin:0;' + (String(pal.texto).length > 130 ? 'font-size:19px;font-weight:600;line-height:1.4' : 'font-family:Anton,sans-serif;font-size:30px;line-height:1.04;text-transform:uppercase') + '">' + esc(pal.texto) + '</p>' +
      '<span class="mono" style="color:#D4D4D4">' + esc(pal.referencia) + ' · ARC 1911</span>' +
      (lei.hoje ? '<button class="btn btn-line" style="color:#fff" disabled>Lido hoje ✓</button>' : '<button class="btn btn-lime" data-acao="li">Li hoje</button>')
      : '<p style="margin:0;font-size:16px;font-weight:600">Os versículos estão chegando.</p>';
    var j = d.jornada.semana;
    var dupla = d.dupla.parceiros;
    var lider = d.eu.funcao === 'lider';
    var pend = lider && d.lider ? d.lider.pendentes.length : 0;
    return '<div class="tela">' +
      '<div class="between"><span class="mono">GC ' + esc(d.gc.nome) + ' · Dínamus</span><div class="row" style="gap:6px">' +
      '<button class="btn btn-sq btn-line" data-acao="atualizar" aria-label="Atualizar">' + ic('atualizar', 20) + '</button>' +
      '<button class="btn btn-sq btn-line" data-acao="ir" data-tela="lembretes" aria-label="Lembretes">' + ic('sino', 20) + '</button>' +
      '<button class="btn btn-sq" style="padding:0" data-acao="perfil" data-id="' + esc(d.eu.id) + '" aria-label="Meu perfil">' + avatar(d.eu.id, d.eu.nome, 44) + '</button>' +
      (lider ? '<button class="btn btn-ink" style="height:44px;font-size:12px;padding:0 12px" data-acao="ir" data-tela="lider">Líder' + (pend ? ' <span class="tag" style="background:var(--red);color:#fff;padding:2px 6px">' + pend + '</span>' : ' ' + ic('seta', 14)) + '</button>' : '') +
      '</div></div>' +
      '<div class="col"><span style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;font-weight:500">' + saudacao() + ', ' + esc(primeiroNome(d.eu.nome).toLowerCase()) + ' —</span>' +
      '<h1 class="display" style="font-size:52px;line-height:.92">Vem pra<br><span class="sublinhado">mesa.' + RISCO + '</span></h1></div>' +
      '<div class="bloco-preto dots" style="position:relative;margin-top:6px">' +
      (seq >= 2 ? '<span class="sticker" style="position:absolute;right:12px;top:-12px;transform:rotate(5deg);background:var(--lime);color:var(--ink)">' + seq + ' DIAS SEGUIDOS</span>' : '') +
      '<span class="mono lime">Palavra do dia</span>' + palavraHtml + '</div>' +
      (d.presenca.minha === '' ? '<div class="cartao"><span class="mono">Vai ' + DIAS_LONGO[r.dia].toLowerCase() + ', ' + dataBR(d.encontro.data) + '?</span>' + botoesPresenca(d) + '</div>' : '') +
      '<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px">' +
      '<button data-acao="ir" data-tela="encontro" style="grid-column:span 3;background:var(--lime);border:0;text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px">' +
      '<span class="mono">Próximo encontro</span><span class="display" style="font-size:36px;line-height:.95">' + DIAS[r.dia] + ' ' + dataBR(d.encontro.data) + '<br>' + esc(horaCurta(d.gc.hora)) + '</span>' +
      '<span style="font-size:12px;font-weight:600">' + esc(d.gc.local) + '</span>' +
      (r.meu ? '<span class="tag" style="background:var(--ink);color:var(--lime);align-self:flex-start">Seu papel: ' + esc(r.meu.papel) + '</span>' : '') +
      '<span class="mono-s">' + r.vai + '/' + d.presenca.total + ' confirmados</span></button>' +
      '<button data-acao="ir" data-tela="jornada" style="grid-column:span 2;background:#fff;border:2px solid var(--ink);text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px">' +
      '<span class="mono">Chama do GC</span><span class="display" style="font-size:52px">' + j.porcento + '<span style="font-size:26px">%</span></span>' +
      '<span class="barra" style="display:block"><span style="width:' + j.porcento + '%"></span></span>' +
      '<span style="font-size:11px;font-weight:600;line-height:1.25">' + j.total + ' de ' + j.meta + ' pontos na semana</span></button></div>' +
      (d.missao ? '<div class="caixa"><span class="mono">Missão da semana · ' + plural(d.missao.quantos, 'cumpriu', 'cumpriram') + '</span>' +
        '<span style="font-size:16px;font-weight:700;line-height:1.35">' + esc(d.missao.texto) + '</span>' +
        '<button class="btn ' + (d.missao.feita ? 'btn-line' : 'btn-ink') + '" data-acao="missao-feita">' + (d.missao.feita ? 'Cumpri ✓ (desfazer)' : 'Cumpri a missão · +3') + '</button></div>' : '') +
      (dupla.length ? '<button data-acao="ir" data-tela="oracao" class="cartao" style="text-align:left;flex-direction:row;align-items:center">' +
        dupla.map(function (x) { return avatar(x.id, x.nome, 40); }).join('') +
        '<span class="col grow"><span class="mono-s">Sua dupla de oração</span><span style="font-weight:800;font-size:15px">' + dupla.map(function (x) { return esc(x.nome); }).join(' e ') + '</span></span>' + ic('seta', 18) + '</button>' : '') +
      '</div>';
  }

  /* ---------- Encontro ---------- */
  function telaEncontro() {
    var d = S.dados, r = resumoEncontro(d);
    var comidas = d.lanche.filter(function (x) { return x.comida; }).length;
    var bebidas = d.lanche.filter(function (x) { return x.bebida; }).length;
    var ml = d.meuLanche || {};
    var assentos = d.presenca.lista.map(function (p) {
      var cls = p.resposta === 'sim' ? 'a-sim' : (p.resposta === 'nao' ? 'a-nao' : 'a-vazio');
      var est = p.resposta === 'sim' ? 'vai' : (p.resposta === 'nao' ? 'não vai' : 'sem resposta');
      return '<button class="assento ' + cls + '" data-acao="perfil" data-id="' + esc(p.id) + '" aria-label="' + esc(p.nome) + ': ' + est + '">' +
        (S.fotos[p.id] ? '<img src="' + esc(S.fotos[p.id]) + '" alt="">' : esc(p.iniciais)) + '</button>';
    }).join('');
    var souLider = d.eu.funcao === 'lider' && d.lider;
    var papeis = d.papeis.map(function (p, i) {
      var quem = souLider
        ? '<select class="sel" data-papel="' + esc(p.papel) + '" aria-label="Quem faz ' + esc(p.papel) + '" style="height:42px;font-size:15px;margin-top:6px"><option value="">— escolher —</option>' +
          d.lider.membros.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === p.membro_id ? ' selected' : '') + '>' + esc(m.nome) + '</option>'; }).join('') + '</select>'
        : '<span style="font-size:13px" class="muted">' + (p.nome ? esc(p.nome) : 'definido pelo líder') + '</span>';
      var tag = p.meu ? '<span class="tag" style="background:var(--ink);color:var(--lime)">VOCÊ</span>' : (p.nome || souLider ? '' : '<span class="tag" style="border:1.5px dashed var(--ink)">A DEFINIR</span>');
      return '<div class="lista-linha"><span class="mono-s muted" style="width:20px">0' + (i + 1) + '</span>' +
        '<div class="col grow"><span style="font-size:15px;font-weight:700">' + esc(p.papel) + (p.papel === 'Louvor' ? ' <span class="muted" style="font-weight:500;font-size:13px">· 3 músicas</span>' : '') + '</span>' +
        quem + '</div>' + tag + '</div>';
    }).join('');
    var listaLanche = d.lanche.map(function (x) {
      return '<div class="row" style="font-size:13px;gap:6px;padding:3px 0"><b>' + esc(primeiroNome(x.nome)) + '</b><span class="muted">' + esc([x.comida, x.bebida].filter(Boolean).join(' + ')) + '</span></div>';
    }).join('');
    return '<div class="tela">' +
      '<div class="between"><span class="mono">Encontro da semana</span><span class="mono">' + esc(d.gc.bairro) + '</span></div>' +
      '<div style="position:relative"><h1 class="display" style="font-size:54px;line-height:.92">' + esc(dataTitulo(d.encontro.data, d.gc.hora)) + '</h1>' +
      (r.meu ? '<span class="sticker" style="position:absolute;right:0;bottom:-30px;transform:rotate(-6deg);background:var(--red);color:#fff">SEU PAPEL: ' + esc(r.meu.papel.toUpperCase()) + '</span>' : '') + '</div>' +
      '<span style="font-size:15px;font-weight:600">' + esc(d.gc.local) + '</span>' +
      '<div class="bloco-preto"><div class="between" style="align-items:flex-end"><span class="mono lime">Lista de presença · quem vai</span>' +
      '<span class="display" style="font-size:40px">' + r.vai + '<span style="font-size:20px;color:#A3A3A3">/' + d.presenca.total + '</span></span></div>' +
      '<div class="assentos">' + assentos + '</div>' +
      '<span class="mono-s" style="color:#A3A3A3">Verde: vai · tracejado: sem resposta · riscado: não vai · toque para ver o perfil</span>' +
      botoesPresenca(d, true) + '</div>' +
      '<div class="col"><div class="between" style="border-bottom:2px solid var(--ink);padding-bottom:6px"><span class="display" style="font-size:26px">Roteiro da noite</span><span class="mono-s">' + (souLider ? 'Você escolhe quem faz' : 'Definido pelo líder') + '</span></div>' + papeis +
      '<div class="lista-linha" style="flex-direction:column;align-items:stretch;gap:8px;padding:10px 0">' +
      '<div class="row"><span class="mono-s muted" style="width:20px">05</span><div class="col grow"><span style="font-size:15px;font-weight:700">Lanche comunitário</span>' +
      '<span style="font-size:13px" class="muted">Cada um leva 1 comida + 1 bebida (casal leva junto) · ' + plural(comidas, 'comida') + ', ' + plural(bebidas, 'bebida') + ' até agora</span></div></div>' +
      '<form data-form="lanche" class="col" style="gap:8px"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' +
      '<label class="campo"><span class="mono-s">Vou levar de comida</span><input name="comida" maxlength="60" value="' + esc(ml.comida) + '" placeholder="ex.: pão de queijo"></label>' +
      '<label class="campo"><span class="mono-s">E de bebida</span><input name="bebida" maxlength="60" value="' + esc(ml.bebida) + '" placeholder="ex.: suco"></label></div>' +
      '<button class="btn btn-ink" type="submit">' + (d.meuLanche ? 'Atualizar meu lanche' : 'Salvar meu lanche') + '</button></form>' +
      (listaLanche ? '<div class="col">' + listaLanche + '</div>' : '') + '</div></div></div>';
  }

  /* ---------- Oração ---------- */
  function cartaoPedido(q) {
    var d = S.dados;
    var acoes;
    if (q.meu) {
      acoes = S.respondendo === q.id
        ? '<form data-form="respondido" data-id="' + esc(q.id) + '" class="col" style="gap:8px"><label class="campo"><span class="mono-s">Conte o que Deus fez (opcional)</span><textarea class="txt" name="testemunho" maxlength="500" data-rasc="test_' + esc(q.id) + '">' + esc(S.rasc['test_' + q.id] || '') + '</textarea></label>' +
          '<div class="row"><button class="btn btn-ink grow" type="submit">Deus respondeu!</button><button class="btn btn-line" type="button" data-acao="cancelar-resposta">Voltar</button></div></form>'
        : '<div class="row"><button class="btn btn-lime grow btn-p" style="height:40px" data-acao="responder" data-id="' + esc(q.id) + '">Deus respondeu</button><button class="btn btn-line btn-p" style="height:40px" data-acao="apagar-pedido" data-id="' + esc(q.id) + '">Apagar</button></div>';
    } else {
      acoes = '<button class="btn ' + (q.euOrando ? 'btn-ink' : 'btn-line') + '" style="height:42px" data-acao="orar" data-id="' + esc(q.id) + '">' + (q.euOrando ? 'Orando por ' + esc(primeiroNome(q.nome)) + ' ✓' : 'Estou orando · +1') + '</button>' +
        (d.eu.funcao === 'lider' ? '<button class="btn btn-p" style="height:34px;align-self:flex-start;text-transform:none;font-weight:600;text-decoration:underline" data-acao="apagar-pedido" data-id="' + esc(q.id) + '">Apagar pedido (líder)</button>' : '');
    }
    return '<div class="cartao"><div class="between"><button class="row" style="background:none;border:0;padding:0;text-align:left" data-acao="perfil" data-id="' + esc(q.membro_id) + '">' + avatar(q.membro_id, q.nome, 32) +
      '<span class="mono-s">' + esc(primeiroNome(q.nome)) + ' · ' + esc(quando(q.criado_em)) + '</span></button>' +
      '<span class="display" style="font-size:22px;line-height:1">' + q.orando + '<span class="mono-s" style="margin-left:4px">orando</span></span></div>' +
      '<p style="margin:0;font-size:16px;font-weight:600;line-height:1.4">' + esc(q.texto) + '</p>' + acoes + '</div>';
  }

  function telaOracao() {
    var d = S.dados, o = d.oracao, du = d.dupla;
    var duplaHtml = du.parceiros.length
      ? '<div style="background:var(--lime);padding:12px 14px;display:flex;align-items:center;gap:12px">' +
        '<div class="row" style="gap:0">' + avatar(d.eu.id, d.eu.nome, 40) + du.parceiros.map(function (x) { return avatar(x.id, x.nome, 40, 'margin-left:-6px;border:2px solid var(--lime)'); }).join('') + '</div>' +
        '<div class="col grow"><span class="mono">Dupla da semana</span><span style="font-size:15px;font-weight:800">' + du.parceiros.map(function (x) { return esc(x.nome); }).join(' e ') + '</span>' +
        '<span class="mono-s">Rodada ' + du.rodada + ' · semana ' + du.semana + ' de ' + du.semanas + ' · troca toda segunda</span></div>' +
        (du.parceiros[0].whatsapp ? '<a class="btn btn-ink btn-sq" href="' + esc(whats(du.parceiros[0].whatsapp, 'Oi! Somos dupla de oração no Kairós esta semana. Como posso orar por você?')) + '" target="_blank" rel="noopener" aria-label="Mandar mensagem para a dupla">' + ic('msg', 20) + '</a>' : '') + '</div>'
      : '<div class="caixa"><span class="mono">Dupla da semana</span><span style="font-weight:600">As duplas começam quando o GC tiver 2 pessoas ou mais.</span></div>';
    var lista = S.abaOracao === 'pedidos'
      ? (o.pedidos.length ? o.pedidos.map(cartaoPedido).join('') : '<p class="muted" style="font-weight:600">Nenhum pedido agora. Que tal ser o primeiro?</p>')
      : (o.respondidos.length ? o.respondidos.map(function (q) {
        return '<div class="cartao" style="border-color:var(--ink);background:var(--lime)"><div class="row">' + avatar(q.membro_id, q.nome, 32) + '<span class="mono-s">' + esc(primeiroNome(q.nome)) + ' · respondido ' + esc(quando(q.respondido_em)) + '</span></div>' +
          '<p style="margin:0;font-size:15px;font-weight:600;line-height:1.4">' + esc(q.texto) + '</p>' +
          (q.testemunho ? '<p style="margin:0;font-size:15px;line-height:1.4;border-left:3px solid var(--ink);padding-left:10px">' + esc(q.testemunho) + '</p>' : '') +
          '<span class="mono-s">' + plural(q.orando, 'pessoa orou', 'pessoas oraram') + '</span></div>';
      }).join('') : '<p class="muted" style="font-weight:600">Os pedidos respondidos aparecem aqui, para lembrarmos o que Deus fez.</p>');
    return '<div class="tela">' +
      '<div class="between" style="align-items:flex-end"><h1 class="display" style="font-size:60px;line-height:.88">Oração</h1>' +
      '<button class="btn btn-ink" style="width:56px;height:56px;padding:0" data-acao="novo-pedido" aria-label="Novo pedido de oração" aria-expanded="' + S.novoPedido + '">' + ic('mais', 26) + '</button></div>' +
      (S.novoPedido ? '<form data-form="pedido" class="bloco-preto"><label class="campo"><span class="mono lime">Seu pedido de oração</span><textarea class="txt" name="texto" maxlength="500" required data-rasc="pedido" placeholder="Pelo que o grupo pode orar?">' + esc(S.rasc.pedido || '') + '</textarea></label>' +
        '<div class="row"><button class="btn btn-lime grow" type="submit">Pedir oração</button><button class="btn" style="color:#fff" type="button" data-acao="novo-pedido">Cancelar</button></div></form>' : '') +
      duplaHtml +
      '<div class="abas" role="tablist">' +
      '<button role="tab" class="' + (S.abaOracao === 'pedidos' ? 'ativo' : '') + '" aria-selected="' + (S.abaOracao === 'pedidos') + '" data-acao="aba-oracao" data-v="pedidos">PEDIDOS (' + o.pedidos.length + ')</button>' +
      '<button role="tab" class="' + (S.abaOracao === 'respondidos' ? 'ativo' : '') + '" aria-selected="' + (S.abaOracao === 'respondidos') + '" data-acao="aba-oracao" data-v="respondidos">DEUS RESPONDEU (' + o.respondidos.length + ')</button></div>' +
      lista + '</div>';
  }

  /* ---------- Celebrar ---------- */
  function telaCelebrar() {
    var d = S.dados, c = d.celebrar;
    var h = c.honrado;
    var honradoHtml;
    if (!h) honradoHtml = '<div class="bloco-preto"><span class="mono lime">Honrado da quinzena</span><span style="font-weight:600">O sorteio começa quando o GC tiver gente.</span></div>';
    else {
      var topo = '<div class="between"><span class="mono lime">Honrado da quinzena</span><span class="mono">' + dataBR(c.inicio) + ' a ' + dataBR(c.fim) + '</span></div>' +
        '<div class="row">' + avatar(h.id, h.nome, 64, 'border:2px solid var(--lime)') + '<span class="display lime" style="font-size:44px;line-height:.95">' + esc(primeiroNome(h.nome)) + '</span></div>';
      var corpo;
      if (c.souEu) {
        corpo = c.liberado
          ? '<span style="font-size:15px;color:#D4D4D4">Você é o honrado! Olha o que o GC escreveu para você:</span>' +
            (c.palavras.length ? c.palavras.map(function (x) { return '<div style="background:#151515;padding:12px;border-left:3px solid var(--lime)"><p style="margin:0 0 6px;font-size:16px;line-height:1.45">' + esc(x.texto) + '</p><span class="mono-s lime">— ' + esc(x.de) + '</span></div>'; }).join('') : '<span style="font-weight:600">Ninguém escreveu ainda.</span>')
          : '<span style="font-size:16px;font-weight:600;line-height:1.4">Você é o honrado desta quinzena! As palavras do GC chegam para você na ' + DIAS_LONGO[diaSemana(c.entrega)].toLowerCase() + ', ' + dataBR(c.entrega) + '. ' + plural(c.enviaram, 'pessoa já escreveu', 'pessoas já escreveram') + '.</span>';
      } else {
        corpo = '<span style="font-size:13px;color:#D4D4D4;line-height:1.4">Todos escrevem. As palavras chegam juntas para ' + esc(primeiroNome(h.nome)) + ' na ' + DIAS_LONGO[diaSemana(c.entrega)].toLowerCase() + ', ' + dataBR(c.entrega) + '.</span>' +
          '<form data-form="honrar" class="col" style="gap:8px"><label class="campo"><span class="mono">Suas palavras</span><textarea class="txt" name="texto" maxlength="800" required data-rasc="honrar" placeholder="O que Deus tem feito através de ' + esc(primeiroNome(h.nome)) + '…">' + esc(S.rasc.honrar != null ? S.rasc.honrar : c.minha) + '</textarea></label>' +

      (L.pendentes.length ? '<div class="bloco-preto"><span class="mono lime">Pedidos para entrar (' + L.pendentes.length + ')</span>' + pend + '</div>' : '') +
      chamadaHtml(L.chamada) +
      '<div style="position:relative"><h2 class="display" style="font-size:52px">Sentindo<br>a falta</h2><span class="sticker" style="position:absolute;right:4px;top:6px;transform:rotate(6deg);background:var(--red);color:#fff">2+ FALTAS</span></div>' +
      '<div class="bloco-preto" style="padding:4px 14px">' + falta + '</div>' +
      '<form data-form="missao" class="caixa"><span class="mono">Missão da semana</span>' +
      '<textarea class="txt" name="texto" maxlength="200" style="min-height:64px" data-rasc="missao" placeholder="ex.: Mande um áudio para sua dupla de oração">' + esc(S.rasc.missao != null ? S.rasc.missao : (d.missao ? d.missao.texto : '')) + '</textarea>' +
      '<button class="btn btn-ink" type="submit">' + (d.missao ? 'Atualizar missão' : 'Lançar missão') + '</button></form>' +
      '<div class="caixa"><span class="mono">Papéis de ' + DIAS_LONGO[r.dia].toLowerCase() + ', ' + dataBR(d.encontro.data) + '</span>' +
      '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' + selects + '</div></div>' +
      (semResp.length ? '<div class="caixa"><span class="mono">Ainda não responderam a presença</span><span style="font-size:14px;font-weight:600;line-height:1.5">' + semResp.map(function (x) { return esc(x.nome); }).join(', ') + '</span></div>' : '') +
      (L.membros.some(function (m) { return !m.genero; }) ? '<div class="caixa" style="background:#fff"><span class="mono">Para as duplas: homem ou mulher?</span>' +
        L.membros.filter(function (m) { return !m.genero; }).map(function (m) {
          return '<div class="between" style="gap:6px"><span style="font-size:14px;font-weight:700">' + esc(m.nome) + '</span><div class="row" style="gap:6px">' +
            '<button class="btn btn-line btn-p" data-acao="definir-genero" data-id="' + esc(m.id) + '" data-v="h">Homem</button>' +
            '<button class="btn btn-line btn-p" data-acao="definir-genero" data-id="' + esc(m.id) + '" data-v="m">Mulher</button></div></div>';
        }).join('') + '</div>' : '') +
      '<div class="caixa"><span class="mono">Duplas de oração · homens com homens, mulheres com mulheres</span>' +
      (L.duplas.length ? L.duplas.map(function (g) { return '<span style="font-size:14px;font-weight:600">' + g.map(esc).join(' + ') + '</span>'; }).join('') : '<span class="muted">Precisa de 2 pessoas ou mais.</span>') + '</div>' +
      (L.honrado.nome ? '<div class="caixa"><span class="mono">Honrado: ' + esc(L.honrado.nome) + ' · ' + plural(L.honrado.enviaram, 'palavra') + '</span>' +
        (L.honrado.faltam.length ? '<span style="font-size:13px;font-weight:600;line-height:1.4">Faltam escrever: ' + L.honrado.faltam.map(esc).join(', ') + '</span>' : '<span style="font-weight:600">Todo mundo já escreveu!</span>') + '</div>' : '') +
      '<div class="caixa"><span class="mono">Alguém esqueceu o código?</span>' +
      '<div class="row"><select class="sel grow" id="sel-codigo"><option value="">Escolha a pessoa</option>' + L.membros.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.nome) + '</option>'; }).join('') + '</select>' +
      '<button class="btn btn-ink" data-acao="trocar-codigo">Gerar</button></div>' +
      (S.codigo ? '<div style="background:var(--ink);color:var(--lime);padding:12px"><span class="mono-s">Novo código de ' + esc(S.codigo.nome) + '</span><div class="display" style="font-size:44px;letter-spacing:.2em">' + esc(S.codigo.codigo) + '</div><span class="mono-s" style="color:#D4D4D4">Mande para a pessoa. O código antigo deixou de valer.</span></div>' : '') + '</div>' +
      '<button class="btn btn-ink" style="height:52px" data-acao="copiar">Copiar resumo pro WhatsApp</button>' +
      '</div></div>';
  }

  function menu() {
    var itens = [['inicio', 'casa', 'Início'], ['encontro', 'agenda', 'Encontro'], ['oracao', 'coracao', 'Oração'], ['celebrar', 'estrela', 'Celebrar'], ['jornada', 'chama', 'Jornada']];
    return '<nav class="menu" aria-label="Navegação principal"><div class="in">' + itens.map(function (i) {
      return '<button class="' + (S.tela === i[0] ? 'ativo' : '') + '" data-acao="ir" data-tela="' + i[0] + '"' + (S.tela === i[0] ? ' aria-current="page"' : '') + '>' + ic(i[1]) + i[2].toUpperCase() + '</button>';
    }).join('') + '</div></nav>';
  }

  /* ---------- Desenho geral ---------- */
  var TELAS = { inicio: telaInicio, encontro: telaEncontro, oracao: telaOracao, celebrar: telaCelebrar, jornada: telaJornada };
  function render() {
    if (!API) { app.innerHTML = telaSemConfig(); return; }
    if (!S.token) {
      if (S.nomes === null) carregarNomes();
      app.innerHTML = S.modo === 'cadastro' ? telaCadastro() : (S.modo === 'aguardando' ? telaAguardando() : telaEntrar());
      return;
    }
    if (!S.dados) { app.innerHTML = '<div class="carregando">' + AMPULHETA.replace('width="56" height="56"', 'width="96" height="96"') + '</div>'; return; }
    if (S.tela === 'lider' && S.dados.lider) { app.innerHTML = telaLider(); return; }
    if (S.tela === 'perfil') { app.innerHTML = telaPerfil(); return; }
    if (S.tela === 'lembretes') { app.innerHTML = telaLembretes(); return; }
    app.innerHTML = (TELAS[S.tela] || telaInicio)() + menu();
  }

  function carregarNomes() {
    if (S.buscandoNomes) return;
    S.nomes = null; S.buscandoNomes = true;
    api('nomes').then(function (n) { S.buscandoNomes = false; S.nomes = n; render(); }, function (e) { S.buscandoNomes = false; S.nomes = []; S.erro = e.message; render(); });
  }
  function carregarPainel(silencioso) {
    if (!S.token) return;
    return api('painel').then(function (d) { S.dados = d; render(); carregarFotos(); }, function (e) { if (!silencioso) toast(e.message); if (!S.dados) render(); });
  }
  function carregarFotos() {
    if (S.fotosAgora && Date.now() - S.fotosAgora < 300000) return;
    S.fotosAgora = Date.now();
    api('fotos').then(function (f) {
      var mudou = JSON.stringify(f) !== JSON.stringify(S.fotos);
      S.fotos = f;
      try { guardar('kairos_fotos', JSON.stringify(f)); } catch (e) {}
      if (mudou) render();
    }, function () {});
  }
  function marcarEspera(el) { if (el && el.classList) el.classList.add('esperando'); }
  function acaoPainel(acao, extra, msg, depois) {
    if (S.ocupado) return;
    S.ocupado = true;
    marcarEspera(S.tocado);
    return api(acao, extra).then(function (d) { S.dados = d; S.ocupado = false; if (depois) depois(); render(); if (msg) toast(msg); },
      function (e) { S.ocupado = false; render(); toast(e.message); });
  }
  /* Ação otimista: a tela muda na hora e o servidor confirma em segundo plano. */
  var FILA = Promise.resolve(), PENDENTES = 0;
  function acaoRapida(acao, extra, mudar, msg) {
    try { mudar(S.dados); } catch (e) {}
    render(); if (msg) toast(msg);
    PENDENTES++;
    FILA = FILA.then(function () { return api(acao, extra); }).then(function (d) {
      PENDENTES--; if (!PENDENTES) { S.dados = d; render(); }
    }, function (e) {
      PENDENTES--; toast(e.message + ' Não salvou, tente de novo.'); carregarPainel(true);
    });
  }
  function atualizarAgora(silencioso) {
    var pux = document.getElementById('puxar');
    pux.querySelector('span').textContent = 'Atualizando…'; pux.className = 'on girando';
    S.fotosAgora = 0;
    return api('painel').then(function (d) { S.dados = d; render(); carregarFotos(); if (!silencioso) toast('Tudo atualizado.'); },
      function (e) { toast(e.message); }).then(function () { pux.className = ''; });
  }
  function atualizarAoNavegar() {
    if (S.ocupado || (S.ultimaAtualizacao && Date.now() - S.ultimaAtualizacao < 4000)) return;
    S.ultimaAtualizacao = Date.now();
    api('painel').then(function (d) {
      var digitando = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      S.dados = d; if (!digitando) render();
    }, function () {});
  }
  function abrirPerfil(id) {
    S.voltarPara = S.tela === 'perfil' ? (S.voltarPara || 'inicio') : S.tela;
    S.tela = 'perfil'; S.perfil = null; S.perfilId = id; S.editando = false;
    render(); window.scrollTo(0, 0);
    api('perfil', { id: id }).then(function (p) { if (S.perfilId === id) { S.perfil = p; render(); } }, function (e) { toast(e.message); S.tela = S.voltarPara; render(); });
  }

  /* Foto: reduz no próprio celular para ficar leve */
  function prepararFoto(arquivo) {
    return new Promise(function (ok, falha) {
      var leitor = new FileReader();
      leitor.onerror = function () { falha(new Error('Não consegui ler a foto.')); };
      leitor.onload = function () {
        var img = new Image();
        img.onerror = function () { falha(new Error('Esse formato de foto não abriu. Tente outra.')); };
        img.onload = function () {
          var lado = Math.min(img.width, img.height);
          var tam = 360;
          var cv = document.createElement('canvas');
          cv.width = tam; cv.height = tam;
          cv.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, tam, tam);
          var q = 0.78, url = cv.toDataURL('image/jpeg', q);
          while (url.length > 44000 && q > 0.3) { q -= 0.08; url = cv.toDataURL('image/jpeg', q); }
          if (url.length > 44000) { cv.width = 240; cv.height = 240; cv.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, 240, 240); url = cv.toDataURL('image/jpeg', 0.6); }
          ok(url);
        };
        img.src = leitor.result;
      };
      leitor.readAsDataURL(arquivo);
    });
  }

  var ACOES = {
    'ir-cadastro': function () { S.modo = 'cadastro'; S.erro = ''; render(); },
    'ir-entrar': function () { S.modo = 'entrar'; S.erro = ''; S.nomes = null; render(); },
    casado: function (el) { lerCadastro(); S.cad.casado = el.dataset.v; render(); },
    'genero-cad': function (el) { lerCadastro(); S.cad.genero = el.dataset.v; render(); },
    veio: function (el) {
      var id = el.dataset.id, atual = el.getAttribute('aria-pressed') === 'true';
      acaoRapida('presenca_real', { id: id, veio: !atual }, function (d) {
        d.lider.chamada.lista.forEach(function (m) { if (m.id === id) m.veio = !atual; });
      }, null);
    },
    'definir-genero': function (el) { acaoPainel('genero', { id: el.dataset.id, genero: el.dataset.v }, 'Salvo. As duplas já foram refeitas.'); },
    ir: function (el) { S.tela = el.dataset.tela; S.codigo = null; render(); window.scrollTo(0, 0); atualizarAoNavegar(); },
    sair: function () { sair(); },
    li: function () {
      acaoRapida('li', {}, function (d) { if (!d.leitura.hoje) { d.leitura.hoje = true; d.leitura.sequencia = (d.leitura.sequencia || 0) + 1; } }, 'Boa! Palavra lida hoje. +1 na chama.');
    },
    atualizar: function () { atualizarAgora(); },
    presenca: function (el) {
      var v = el.dataset.v === S.dados.presenca.minha ? '' : el.dataset.v;
      acaoRapida('presenca', { resposta: v }, function (d) {
        d.presenca.minha = v;
        d.presenca.lista.forEach(function (x) { if (x.id === d.eu.id) x.resposta = v; });
      }, v === 'sim' ? 'Lugar guardado! +1 na chama.' : (v === 'nao' ? 'Tudo bem, vamos sentir sua falta.' : 'Resposta desfeita.'));
    },
    aprovar: function (el) { acaoPainel('aprovar', { id: el.dataset.id, aprovar: el.dataset.v === '1' }, el.dataset.v === '1' ? 'Aprovado!' : 'Pedido recusado.'); },
    copiar: function () { copiar(resumoWhats()); },
    'missao-feita': function () {
      var feita = S.dados.missao && S.dados.missao.feita;
      acaoRapida('missao_feita', {}, function (d) { d.missao.feita = !feita; d.missao.quantos += feita ? -1 : 1; }, feita ? 'Desfeito.' : 'Missão cumprida! +3 na chama.');
    },
    'novo-pedido': function () { S.novoPedido = !S.novoPedido; render(); if (S.novoPedido) { var t = document.querySelector('textarea[name=texto]'); if (t) t.focus(); } },
    'aba-oracao': function (el) { S.abaOracao = el.dataset.v; render(); },
    orar: function (el) {
      var id = el.dataset.id;
      acaoRapida('orar', { id: id }, function (d) {
        d.oracao.pedidos.forEach(function (q) { if (q.id === id) { q.euOrando = !q.euOrando; q.orando += q.euOrando ? 1 : -1; } });
      }, null);
    },
    responder: function (el) { S.respondendo = el.dataset.id; render(); },
    'cancelar-resposta': function () { S.respondendo = ''; render(); },
    'apagar-pedido': function (el) { acaoPainel('pedido_apagar', { id: el.dataset.id }, 'Pedido apagado.'); },
    perfil: function (el) { abrirPerfil(el.dataset.id); },
    'voltar-perfil': function () { S.tela = S.voltarPara || 'inicio'; S.perfil = null; render(); },
    editar: function () { S.editando = !S.editando; render(); },
    'trocar-codigo': function () {
      var sel = document.getElementById('sel-codigo');
      if (!sel || !sel.value) { toast('Escolha a pessoa primeiro.'); return; }
      api('trocar_codigo', { id: sel.value }).then(function (c) { S.codigo = c; render(); }, function (e) { toast(e.message); });
    }
  };

  function lerCadastro() {
    var f = document.querySelector('form[data-form="cadastro"]');
    if (!f) return;
    ['nome', 'whatsapp', 'aniversario', 'conjugeId'].forEach(function (k) { if (f.elements[k]) S.cad[k] = f.elements[k].value; });
  }

  function resumoWhats() {
    var d = S.dados, r = resumoEncontro(d);
    var vai = d.presenca.lista.filter(function (x) { return x.resposta === 'sim'; }).map(function (x) { return primeiroNome(x.nome); });
    var linhas = ['*GC ' + d.gc.nome + ' · ' + dataTitulo(d.encontro.data, d.gc.hora) + '*', d.gc.local + ' · ' + d.gc.bairro, '', '*Roteiro*'];
    d.papeis.forEach(function (p) { linhas.push(p.papel + ': ' + (p.nome ? primeiroNome(p.nome) : 'a definir')); });
    linhas.push('', '*Confirmados (' + vai.length + '/' + d.presenca.total + ')*: ' + (vai.join(', ') || 'ninguém ainda'));
    if (d.lanche.length) linhas.push('', '*Lanche*', d.lanche.map(function (x) { return primeiroNome(x.nome) + ': ' + [x.comida, x.bebida].filter(Boolean).join(' + '); }).join('\n'));
    if (d.missao) linhas.push('', '*Missão da semana:* ' + d.missao.texto);
    linhas.push('', 'Marque sua presença no app do Kairós: ' + location.href.split('#')[0].split('?')[0]);
    return linhas.join('\n');
  }
  function copiar(texto) {
    var ok = function () { toast('Resumo copiado. É só colar no WhatsApp.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, function () { copiarVelho(texto); ok(); });
    else { copiarVelho(texto); ok(); }
  }
  function copiarVelho(texto) {
    var t = document.createElement('textarea'); t.value = texto; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-acao]');
    if (!el || el.disabled) return;
    var f = ACOES[el.dataset.acao];
    if (f) {
      e.preventDefault();
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (x) {} }
      S.tocado = el; f(el);
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.papel) S.tocado = el;
    if (el.dataset && el.dataset.papel) acaoPainel('papel', { papel: el.dataset.papel, membroId: el.value }, 'Papel salvo.');
    if (el.dataset && el.dataset.foto && el.files && el.files[0]) {
      toast('Preparando a foto…');
      prepararFoto(el.files[0]).then(function (url) {
        return api('perfil_salvar', { foto: url }).then(function (p) {
          S.perfil = p; S.fotos[p.id] = p.foto; guardar('kairos_fotos', JSON.stringify(S.fotos)); render(); toast('Foto salva!');
        });
      }).catch(function (err) { toast(err.message); });
    }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.mascara === 'ddmm') {
      var v = el.value.replace(/\D/g, '').slice(0, 4);
      el.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v;
    }
    if (el.name === 'pin') el.value = el.value.replace(/\D/g, '').slice(0, 4);
    if (el.dataset && el.dataset.rasc) S.rasc[el.dataset.rasc] = el.value;
  });

  document.addEventListener('submit', function (e) {
    var f = e.target, tipo = f.dataset.form;
    if (!tipo) return;
    e.preventDefault();
    if (S.ocupado) return;
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (x) {} }
    S.tocado = f.querySelector('[type=submit]'); marcarEspera(S.tocado);
    var v = {};
    Array.prototype.forEach.call(f.elements, function (el) { if (el.name) v[el.name] = el.value; });
    if (tipo === 'entrar') {
      S.ocupado = true; S.erro = ''; render();
      api('entrar', { id: v.id, pin: v.pin }).then(function (d) {
        S.ocupado = false; S.token = d.token; guardar('kairos_token', d.token); guardar('kairos_ultimo', v.id); S.tela = 'inicio'; render(); carregarPainel();
      }, function (err) { S.ocupado = false; S.erro = err.message; render(); });
    } else if (tipo === 'cadastro') {
      lerCadastro();
      S.ocupado = true; S.erro = ''; render();
      api('cadastrar', { nome: v.nome, whatsapp: v.whatsapp, aniversario: v.aniversario, casado: S.cad.casado, genero: S.cad.genero || '', conjugeId: v.conjugeId || '', pin: v.pin }).then(function (d) {
        S.ocupado = false; S.cad = { casado: 'nao' };
        if (d.status === 'ativo') { S.token = d.token; guardar('kairos_token', d.token); S.tela = 'inicio'; render(); carregarPainel(); toast('Perfil criado. Você é o líder do GC.'); }
        else { S.modo = 'aguardando'; render(); }
      }, function (err) { S.ocupado = false; S.erro = err.message; render(); });
    } else if (tipo === 'lanche') {
      acaoPainel('lanche', { comida: v.comida, bebida: v.bebida }, 'Lanche salvo!');
    } else if (tipo === 'pedido') {
      acaoPainel('pedido_novo', { texto: v.texto }, 'Pedido enviado. O GC vai orar com você.', function () { S.rasc.pedido = ''; S.novoPedido = false; S.abaOracao = 'pedidos'; });
    } else if (tipo === 'respondido') {
      acaoPainel('pedido_respondido', { id: f.dataset.id, testemunho: v.testemunho }, 'Glória a Deus!', function () { S.respondendo = ''; S.abaOracao = 'respondidos'; });
    } else if (tipo === 'honrar') {
      acaoPainel('honrar', { texto: v.texto }, 'Palavras enviadas! +2 na chama.', function () { S.rasc.honrar = null; });
    } else if (tipo === 'missao') {
      acaoPainel('missao', { texto: v.texto }, 'Missão lançada para o GC.', function () { S.rasc.missao = null; });
    } else if (tipo === 'perfil') {
      S.ocupado = true;
      api('perfil_salvar', { whatsapp: v.whatsapp, aniversario: v.aniversario, prato: v.prato, genero: v.genero }).then(function (p) {
        S.ocupado = false; S.perfil = p; S.editando = false; render(); toast('Perfil salvo!'); carregarPainel(true);
      }, function (err) { S.ocupado = false; toast(err.message); });
    }
  });

  document.addEventListener('visibilitychange', function () {
    var digitando = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (document.visibilityState === 'visible' && S.token && S.dados && !digitando) carregarPainel(true);
  });

  /* Puxar a tela para baixo atualiza */
  var puxY = null, puxou = false;
  document.addEventListener('touchstart', function (e) {
    puxY = (window.scrollY <= 0 && S.token && S.dados && e.touches.length === 1) ? e.touches[0].clientY : null; puxou = false;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (puxY === null) return;
    var dy = e.touches[0].clientY - puxY;
    var pux = document.getElementById('puxar');
    if (dy > 30 && window.scrollY <= 0) { pux.className = 'on'; puxou = dy > 90; pux.querySelector('span').textContent = puxou ? 'Solte para atualizar' : 'Puxe para atualizar'; }
    else if (!pux.classList.contains('girando')) pux.className = '';
  }, { passive: true });
  document.addEventListener('touchend', function () {
    if (puxY === null) return;
    puxY = null;
    var pux = document.getElementById('puxar');
    if (puxou) { if (navigator.vibrate) { try { navigator.vibrate(15); } catch (x) {} } atualizarAgora(); }
    else if (!pux.classList.contains('girando')) pux.className = '';
  });

  render();
  if (S.token && API) carregarPainel();
})();
</script>
