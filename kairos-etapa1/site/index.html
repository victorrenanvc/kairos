<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kairós">
<meta name="theme-color" content="#0A0A0A">
<title>Kairós · GC Dínamus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0A;--paper:#EFEEE9;--lime:#C8F031;--red:#E8341C;--muted:#525252;--line:#C9C6BC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.tela{padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 110px);display:flex;flex-direction:column;gap:14px}
.tela.sem-nav{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.mono-s{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.display{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:.9;margin:0}
.lime{color:var(--lime)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.btn{height:48px;border:0;padding:0 16px;font:800 14px Archivo,sans-serif;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.5}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--lime)}
.btn-line{background:transparent;border:2px solid currentColor}
.btn-sq{width:44px;height:44px;padding:0}
.grow{flex:1}
.campo{display:flex;flex-direction:column;gap:5px}
.campo input,.campo select,select.sel{height:48px;border:2px solid var(--ink);background:#fff;padding:0 12px;font-size:16px;border-radius:0;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.bloco-preto{background:var(--ink);color:#fff;padding:16px;display:flex;flex-direction:column;gap:10px}
.dots{background-image:radial-gradient(rgba(200,240,49,.10) 1px,transparent 1.2px);background-size:8px 8px}
.caixa{border:2px solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sticker{display:inline-block;padding:6px 9px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600}
.lista-linha{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line);padding:6px 0}
.tag{padding:5px 8px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;white-space:nowrap}
.assentos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.assento{height:44px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.a-sim{background:var(--lime);color:var(--ink)}
.a-vazio{border:1.5px dashed #737373;color:#A3A3A3}
.a-nao{border:1.5px solid #404040;color:#737373;text-decoration:line-through}
nav.menu{position:fixed;left:0;right:0;bottom:0;z-index:5}
nav.menu .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--ink)}
nav.menu button{background:transparent;border:0;color:#D4D4D4;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600}
nav.menu button.ativo{background:var(--lime);color:var(--ink)}
nav.menu button.off{opacity:.45}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--lime);padding:12px 16px;font:600 13px 'IBM Plex Mono',monospace;max-width:90vw;z-index:9;display:none}
.carregando{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--ink)}
.erro{background:var(--red);color:#fff;padding:10px 12px;font-weight:700;font-size:14px}
.sublinhado{position:relative;display:inline-block}
.sublinhado svg{position:absolute;left:0;bottom:-10px;width:100%;height:18px}
.lider-tela{background:var(--lime);min-height:100dvh}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var API = window.KAIROS_API || '';
  var DIAS = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
  var DIAS_LONGO = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  var S = {
    token: guardar('kairos_token'),
    tela: 'inicio',
    dados: null,
    nomes: null,
    erro: '',
    ocupado: false,
    cad: { casado: 'nao' },
    modo: 'entrar'
  };
  var app = document.getElementById('app');

  function guardar(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k) || '';
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    } catch (e) { return ''; }
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }
  function api(acao, extra) {
    var corpo = Object.assign({ acao: acao, token: S.token }, extra || {});
    return fetch(API, { method: 'POST', body: JSON.stringify(corpo) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) {
          if (/^SESSAO/.test(j.erro)) { sair(true); }
          throw new Error(String(j.erro).replace(/^SESSAO:\s*/, ''));
        }
        return j.dados;
      }, function () { throw new Error('Sem conexão. Confira a internet e tente de novo.'); });
  }
  function sair(silencioso) {
    S.token = ''; guardar('kairos_token', null); S.dados = null; S.tela = 'inicio'; S.modo = 'entrar';
    if (!silencioso) render();
  }
  function dataBR(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1]; }
  function dataLonga(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function diaSemana(iso) { var p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
  function saudacao() { var h = new Date().getHours(); return h < 12 ? 'bom dia' : (h < 18 ? 'boa tarde' : 'boa noite'); }
  function plural(n, p) { return n + ' ' + p + (n === 1 ? '' : 's'); }
  function primeiroNome(n) { return String(n).trim().split(/\s+/)[0]; }
  var MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  function horaCurta(h) { var m = String(h || '').match(/(\d{1,2}):(\d{2})/); if (!m) return '20h'; return Number(m[1]) + 'h' + (m[2] === '00' ? '' : m[2]); }
  function dataTitulo(iso, hora) { var p = String(iso).split('-'); return DIAS_LONGO[diaSemana(iso)] + ' ' + p[2] + ' ' + MESES[Number(p[1]) - 1] + ' ' + p[0] + ' ' + horaCurta(hora); }

  var IC = {
    casa: '<path d="M3 11l9-7 9 7v10h-6v-6H9v6H3z"></path>',
    agenda: '<rect x="3" y="5" width="18" height="16"></rect><path d="M16 3v4M8 3v4M3 10h18"></path>',
    coracao: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path>',
    estrela: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path>',
    chama: '<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5"></path>',
    seta: '<path d="M7 17L17 7M8 7h9v9"></path>',
    voltar: '<path d="M15 18l-6-6 6-6"></path>'
  };
  function ic(nome, tam) {
    return '<svg width="' + (tam || 22) + '" height="' + (tam || 22) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true">' + IC[nome] + '</svg>';
  }
  var AMPULHETA = '<svg width="56" height="56" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#0A0A0A"/><rect x="136" y="96" width="240" height="28" fill="#C8F031"/><rect x="136" y="388" width="240" height="28" fill="#C8F031"/><path d="M160 124 L352 124 L268 256 L352 388 L160 388 L244 256 Z" fill="none" stroke="#C8F031" stroke-width="14"/><path d="M204 186 L308 186 L262 250 L250 250 Z" fill="#C8F031"/><rect x="253" y="256" width="6" height="92" fill="#C8F031"/><path d="M190 380 Q256 300 322 380 Z" fill="#C8F031"/></svg>';
  var RISCO = '<svg viewBox="0 0 170 20" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M3 12 C40 4, 90 18, 167 7" stroke="#E8341C" stroke-width="4" stroke-linecap="round"/></svg>';

  /* ---------------- Telas de acesso ---------------- */
  function cabecalhoAcesso(titulo) {
    return '<div class="bloco-preto dots" style="margin:calc(-1 * (env(safe-area-inset-top) + 18px)) -18px 0;padding:calc(env(safe-area-inset-top) + 30px) 18px 18px">' +
      '<div class="between" style="align-items:flex-end"><div class="col" style="gap:6px"><span class="mono lime">GC Kairós · Dínamus</span>' +
      '<h1 class="display" style="font-size:52px">' + titulo + '</h1></div>' + AMPULHETA + '</div></div>';
  }
  function erroHtml() { return S.erro ? '<div class="erro" role="alert">' + esc(S.erro) + '</div>' : ''; }

  function telaSemConfig() {
    return '<div class="tela sem-nav">' + cabecalhoAcesso('Quase lá.') +
      '<p style="font-size:16px;font-weight:600;line-height:1.4">Falta colar o link do motor (Apps Script) no arquivo <b>config.js</b>. Siga o passo a passo.</p></div>';
  }

  function telaEntrar() {
    var nomes = S.nomes;
    var corpo;
    if (nomes === null) corpo = '<p class="mono">Carregando nomes…</p>';
    else if (!nomes.length) corpo = '<p style="font-size:16px;font-weight:600;line-height:1.4">Ninguém cadastrado ainda. O primeiro perfil criado vira o líder do GC.</p>' +
      erroHtml() + '<button class="btn btn-ink" data-acao="ir-cadastro">Criar o primeiro perfil</button>';
    else corpo = '<form data-form="entrar" class="col" style="gap:12px">' +
      '<label class="campo"><span class="mono">Quem é você?</span><select name="id" required><option value="">Escolha seu nome</option>' +
      nomes.map(function (n) { return '<option value="' + esc(n.id) + '"' + (guardar('kairos_ultimo') === n.id ? ' selected' : '') + '>' + esc(n.nome) + '</option>'; }).join('') +
      '</select></label>' +
      '<label class="campo"><span class="mono">Seu código de 4 números</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required style="font-size:22px;letter-spacing:.4em"></label>' +
      erroHtml() +
      '<button class="btn btn-ink" type="submit"' + (S.ocupado ? ' disabled' : '') + '>' + (S.ocupado ? 'Entrando…' : 'Entrar') + '</button></form>' +
      '<div class="between" style="border-top:2px solid var(--ink);padding-top:14px"><span style="font-weight:700">Primeira vez aqui?</span>' +
      '<button class="btn btn-line" data-acao="ir-cadastro">Criar perfil</button></div>';
    return '<div class="tela sem-nav">' + cabecalhoAcesso('Bem-vindo<br>de volta.') + corpo + '</div>';
  }

  function telaCadastro() {
    var c = S.cad;
    var conjuges = (S.nomes || []).filter(function (n) { return !n.conjuge_id; });
    return '<div class="tela sem-nav">' + cabecalhoAcesso('Puxa uma<br>cadeira.') +
      '<form data-form="cadastro" class="col" style="gap:12px">' +
      '<label class="campo"><span class="mono">Nome e sobrenome</span><input name="nome" autocomplete="name" maxlength="60" required value="' + esc(c.nome) + '"></label>' +
      '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' +
      '<label class="campo"><span class="mono">WhatsApp</span><input name="whatsapp" type="tel" autocomplete="tel" placeholder="(62) 9…" value="' + esc(c.whatsapp) + '"></label>' +
      '<label class="campo"><span class="mono">Aniversário</span><input name="aniversario" inputmode="numeric" placeholder="DD/MM" maxlength="5" data-mascara="ddmm" value="' + esc(c.aniversario) + '"></label></div>' +
      '<div class="campo"><span class="mono">Você é casado(a)?</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' +
      '<button type="button" class="btn ' + (c.casado === 'sim' ? 'btn-lime' : '') + '" style="border:2px solid var(--ink);' + (c.casado === 'sim' ? '' : 'background:#fff') + '" data-acao="casado" data-v="sim" aria-pressed="' + (c.casado === 'sim') + '">Sim</button>' +
      '<button type="button" class="btn ' + (c.casado === 'nao' ? 'btn-lime' : '') + '" style="border:2px solid var(--ink);' + (c.casado === 'nao' ? '' : 'background:#fff') + '" data-acao="casado" data-v="nao" aria-pressed="' + (c.casado === 'nao') + '">Não</button></div></div>' +
      (c.casado === 'sim' ? '<label class="campo"><span class="mono">Seu cônjuge</span><select name="conjugeId"><option value="">Ainda não tem perfil</option>' +
        conjuges.map(function (n) { return '<option value="' + esc(n.id) + '"' + (c.conjugeId === n.id ? ' selected' : '') + '>' + esc(n.nome) + '</option>'; }).join('') + '</select></label>' : '') +
      '<label class="campo"><span class="mono">Crie um código de 4 números</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required style="font-size:22px;letter-spacing:.4em"></label>' +
      '<span class="mono-s muted">Anote o código: é com ele que você entra.</span>' +
      erroHtml() +
      '<button class="btn btn-ink" type="submit" style="height:52px"' + (S.ocupado ? ' disabled' : '') + '>' + (S.ocupado ? 'Enviando…' : 'Criar meu perfil') + '</button>' +
      '<span class="mono-s" style="text-align:center">O líder aprova sua entrada no grupo.</span></form>' +
      '<button class="btn" style="background:transparent;text-transform:none;font-weight:700" data-acao="ir-entrar">Já tenho perfil · Entrar</button></div>';
  }

  function telaAguardando() {
    return '<div class="tela sem-nav">' + cabecalhoAcesso('Pedido<br>enviado.') +
      '<p style="font-size:17px;font-weight:600;line-height:1.45">Agora é só esperar o líder aprovar. Depois, volte aqui, escolha seu nome e entre com o seu código.</p>' +
      '<button class="btn btn-ink" data-acao="ir-entrar">Ir para entrar</button></div>';
  }

  /* ---------------- Telas do app ---------------- */
  function resumoEncontro(d) {
    var dia = diaSemana(d.encontro.data);
    var vai = d.presenca.lista.filter(function (x) { return x.resposta === 'sim'; }).length;
    var meu = d.papeis.filter(function (p) { return p.meu; })[0];
    return { dia: dia, vai: vai, meu: meu };
  }

  function botoesPresenca(d, escuro) {
    var m = d.presenca.minha;
    var cor = escuro ? '#fff' : 'var(--ink)';
    return '<div class="row" style="gap:6px">' +
      '<button class="btn grow ' + (m === 'sim' ? 'btn-lime' : '') + '" style="' + (m === 'sim' ? '' : 'background:transparent;border:2px solid ' + cor + ';color:' + cor) + '" data-acao="presenca" data-v="sim" aria-pressed="' + (m === 'sim') + '">' + (m === 'sim' ? 'Tô dentro ✓' : 'Tô dentro') + '</button>' +
      '<button class="btn" style="' + (m === 'nao' ? 'background:var(--red);color:#fff' : 'background:transparent;border:2px solid ' + cor + ';color:' + cor) + '" data-acao="presenca" data-v="nao" aria-pressed="' + (m === 'nao') + '">Não vou poder</button></div>';
  }

  function telaInicio() {
    var d = S.dados, r = resumoEncontro(d);
    var lido = guardar('kairos_li_' + new Date().toDateString()) === '1';
    var pal = d.palavra;
    var palavraHtml = pal ?
      '<p style="margin:0;' + (String(pal.texto).length > 150 ? 'font-size:19px;font-weight:600;line-height:1.4' : 'font-family:Anton,sans-serif;font-size:30px;line-height:1.02;text-transform:uppercase') + '">' + esc(pal.texto || pal.referencia) + '</p>' +
      '<span class="mono" style="color:#D4D4D4">' + esc(pal.referencia) + ' · ARC 1914</span>' +
      '<button class="btn ' + (lido ? 'btn-line' : 'btn-lime') + '" style="' + (lido ? 'color:#fff' : '') + '" data-acao="li">' + (lido ? 'Lido hoje ✓' : 'Li hoje') + '</button>'
      : '<p style="margin:0;font-size:16px;font-weight:600;line-height:1.4">Os versículos chegam na próxima atualização do app.</p>';
    var meuL = d.meuLanche;
    return '<div class="tela">' +
      '<div class="between"><span class="mono">GC ' + esc(d.gc.nome) + ' · Dínamus</span>' +
      (d.eu.funcao === 'lider' ? '<button class="btn btn-ink" style="height:44px;font-size:12px" data-acao="ir" data-tela="lider">Líder ' + ic('seta', 14) + (d.lider && d.lider.pendentes.length ? ' <span class="tag" style="background:var(--red);color:#fff;padding:2px 6px">' + d.lider.pendentes.length + '</span>' : '') + '</button>' : '') + '</div>' +
      '<div class="col"><span style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;font-weight:500">' + saudacao() + ', ' + esc(primeiroNome(d.eu.nome).toLowerCase()) + ' —</span>' +
      '<h1 class="display" style="font-size:52px;line-height:.92">Vem pra<br><span class="sublinhado">mesa.' + RISCO + '</span></h1></div>' +
      '<div class="bloco-preto dots" style="position:relative;margin-top:6px">' +
      (lido ? '<span class="sticker" style="position:absolute;right:12px;top:-12px;transform:rotate(5deg);background:var(--lime);color:var(--ink)">LIDO HOJE</span>' : '') +
      '<span class="mono lime">Palavra do dia</span>' + palavraHtml + '</div>' +
      (d.presenca.minha === '' ? '<div class="caixa" style="background:#fff"><span class="mono">Vai ' + DIAS_LONGO[r.dia].toLowerCase() + ', ' + dataBR(d.encontro.data) + '?</span>' + botoesPresenca(d) + '</div>' : '') +
      '<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px">' +
      '<button data-acao="ir" data-tela="encontro" style="grid-column:span 3;background:var(--lime);border:0;text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px">' +
      '<span class="mono">Próximo encontro</span><span class="display" style="font-size:36px;line-height:.95">' + DIAS[r.dia] + ' ' + dataBR(d.encontro.data) + '<br>' + esc(horaCurta(d.gc.hora)) + '</span>' +
      '<span style="font-size:12px;font-weight:600">' + esc(d.gc.local) + '</span>' +
      (r.meu ? '<span class="tag" style="background:var(--ink);color:var(--lime);align-self:flex-start">Seu papel: ' + esc(r.meu.papel) + '</span>' : '') +
      '<span class="mono-s">' + r.vai + '/' + d.presenca.total + ' confirmados</span></button>' +
      '<button data-acao="ir" data-tela="encontro" style="grid-column:span 2;background:#fff;border:2px solid var(--ink);text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px">' +
      '<span class="mono">Seu lanche</span>' +
      (meuL ? '<span style="font-size:15px;font-weight:800;line-height:1.25">' + esc(meuL.comida || '—') + '<br><span class="muted" style="font-weight:600">' + esc(meuL.bebida || '') + '</span></span>' : '<span class="display" style="font-size:30px">A definir</span>') +
      '<span class="mono-s">' + d.lanche.length + ' já disseram</span></button></div>' +
      '<button class="btn" style="background:transparent;text-transform:none;font-weight:600;align-self:center;color:var(--muted)" data-acao="sair">Sair do app</button>' +
      '</div>';
  }

  function telaEncontro() {
    var d = S.dados, r = resumoEncontro(d);
    var comidas = d.lanche.filter(function (x) { return x.comida; }).length;
    var bebidas = d.lanche.filter(function (x) { return x.bebida; }).length;
    var ml = d.meuLanche || {};
    var assentos = d.presenca.lista.map(function (p) {
      var cls = p.resposta === 'sim' ? 'a-sim' : (p.resposta === 'nao' ? 'a-nao' : 'a-vazio');
      var est = p.resposta === 'sim' ? 'vai' : (p.resposta === 'nao' ? 'não vai' : 'sem resposta');
      return '<span class="assento ' + cls + '" title="' + esc(p.nome) + '" aria-label="' + esc(p.nome) + ': ' + est + '">' + esc(p.iniciais) + '</span>';
    }).join('');
    var papeis = d.papeis.map(function (p, i) {
      return '<div class="lista-linha"><span class="mono-s muted" style="width:20px">0' + (i + 1) + '</span>' +
        '<div class="col grow"><span style="font-size:15px;font-weight:700">' + esc(p.papel) + (p.papel === 'Louvor' ? ' <span class="muted" style="font-weight:500;font-size:13px">· 3 músicas</span>' : '') + '</span>' +
        '<span style="font-size:13px" class="muted">' + (p.nome ? esc(p.nome) : 'definido pelo líder') + '</span></div>' +
        (p.meu ? '<span class="tag" style="background:var(--ink);color:var(--lime)">VOCÊ</span>' : (p.nome ? '' : '<span class="tag" style="border:1.5px dashed var(--ink)">A DEFINIR</span>')) + '</div>';
    }).join('');
    var listaLanche = d.lanche.map(function (x) {
      return '<div class="row" style="font-size:13px;gap:6px;padding:3px 0"><b>' + esc(primeiroNome(x.nome)) + '</b><span class="muted">' + esc([x.comida, x.bebida].filter(Boolean).join(' + ')) + '</span></div>';
    }).join('');
    return '<div class="tela">' +
      '<div class="between"><span class="mono">Encontro da semana</span><span class="mono">' + esc(d.gc.bairro) + '</span></div>' +
      '<div style="position:relative"><h1 class="display" style="font-size:54px;line-height:.92">' + esc(dataTitulo(d.encontro.data, d.gc.hora)) + '</h1>' +
      (r.meu ? '<span class="sticker" style="position:absolute;right:0;bottom:-30px;transform:rotate(-6deg);background:var(--red);color:#fff">SEU PAPEL: ' + esc(r.meu.papel.toUpperCase()) + '</span>' : '') + '</div>' +
      '<span style="font-size:15px;font-weight:600">' + esc(d.gc.local) + '</span>' +
      '<div class="bloco-preto"><div class="between" style="align-items:flex-end"><span class="mono lime">Lista de presença · quem vai</span>' +
      '<span class="display" style="font-size:40px">' + r.vai + '<span style="font-size:20px;color:#A3A3A3">/' + d.presenca.total + '</span></span></div>' +
      '<div class="assentos">' + assentos + '</div>' +
      '<span class="mono-s" style="color:#A3A3A3">Verde: vai · tracejado: sem resposta · riscado: não vai</span>' +
      botoesPresenca(d, true) + '</div>' +
      '<div class="col"><div class="between" style="border-bottom:2px solid var(--ink);padding-bottom:6px"><span class="display" style="font-size:26px">Roteiro da noite</span><span class="mono-s">Definido pelo líder</span></div>' + papeis +
      '<div class="lista-linha" style="flex-direction:column;align-items:stretch;gap:8px;padding:10px 0">' +
      '<div class="row"><span class="mono-s muted" style="width:20px">05</span><div class="col grow"><span style="font-size:15px;font-weight:700">Lanche comunitário</span>' +
      '<span style="font-size:13px" class="muted">Cada um leva 1 comida + 1 bebida (casal leva junto) · ' + plural(comidas, 'comida') + ', ' + plural(bebidas, 'bebida') + ' até agora</span></div></div>' +
      '<form data-form="lanche" class="col" style="gap:8px"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' +
      '<label class="campo"><span class="mono-s">Vou levar de comida</span><input name="comida" maxlength="60" value="' + esc(ml.comida) + '" placeholder="ex.: pão de queijo"></label>' +
      '<label class="campo"><span class="mono-s">E de bebida</span><input name="bebida" maxlength="60" value="' + esc(ml.bebida) + '" placeholder="ex.: suco"></label></div>' +
      '<button class="btn btn-ink" type="submit">' + (d.meuLanche ? 'Atualizar meu lanche' : 'Salvar meu lanche') + '</button></form>' +
      (listaLanche ? '<div class="col">' + listaLanche + '</div>' : '') + '</div></div></div>';
  }

  function telaLider() {
    var d = S.dados, L = d.lider || { pendentes: [], membros: [] }, r = resumoEncontro(d);
    var semResp = d.presenca.lista.filter(function (x) { return !x.resposta; });
    var semDono = d.papeis.filter(function (p) { return !p.nome; }).length;
    var pend = L.pendentes.length ? L.pendentes.map(function (p) {
      return '<div class="lista-linha" style="border-color:#333"><div class="col grow"><span style="font-weight:700">' + esc(p.nome) + '</span>' +
        '<span style="font-size:12px;color:#D4D4D4">' + esc([p.whatsapp, p.aniversario && ('aniversário ' + p.aniversario)].filter(Boolean).join(' · ')) + '</span></div>' +
        '<button class="btn btn-lime" style="height:40px;padding:0 10px;font-size:12px" data-acao="aprovar" data-id="' + esc(p.id) + '" data-v="1">Aprovar</button>' +
        '<button class="btn" style="height:40px;padding:0 10px;font-size:12px;background:transparent;color:#fff;border:2px solid #fff" data-acao="aprovar" data-id="' + esc(p.id) + '" data-v="0" aria-label="Recusar ' + esc(p.nome) + '">✕</button></div>';
    }).join('') : '<span style="font-size:14px;color:#D4D4D4">Ninguém esperando aprovação.</span>';
    var selects = d.papeis.map(function (p) {
      return '<label class="campo"><span class="mono-s">' + esc(p.papel) + '</span><select class="sel" data-papel="' + esc(p.papel) + '"><option value="">— a definir —</option>' +
        L.membros.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === p.membro_id ? ' selected' : '') + '>' + esc(m.nome) + '</option>'; }).join('') + '</select></label>';
    }).join('');
    return '<div class="lider-tela"><div class="tela sem-nav">' +
      '<div class="between"><button class="btn btn-ink btn-sq" data-acao="ir" data-tela="inicio" aria-label="Voltar">' + ic('voltar', 20) + '</button><span class="mono">Painel do líder · só você vê</span></div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)">' +
      '<div class="col" style="padding:10px 6px 10px 0;border-right:1px solid var(--ink)"><span class="display" style="font-size:40px;line-height:1">' + r.vai + '/' + d.presenca.total + '</span><span class="mono-s">Confirmados</span></div>' +
      '<div class="col" style="padding:10px 6px;border-right:1px solid var(--ink)"><span class="display" style="font-size:40px;line-height:1">' + semResp.length + '</span><span class="mono-s">Sem resposta</span></div>' +
      '<div class="col" style="padding:10px 0 10px 6px"><span class="display" style="font-size:40px;line-height:1">' + semDono + '</span><span class="mono-s">Papéis sem dono</span></div></div>' +
      '<div class="bloco-preto"><span class="mono lime">Pedidos para entrar (' + L.pendentes.length + ')</span>' + pend + '</div>' +
      '<div class="caixa"><span class="mono">Papéis de ' + DIAS_LONGO[r.dia].toLowerCase() + ', ' + dataBR(d.encontro.data) + '</span>' +
      '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' + selects + '</div></div>' +
      (semResp.length ? '<div class="caixa"><span class="mono">Ainda não responderam</span><span style="font-size:14px;font-weight:600;line-height:1.5">' + semResp.map(function (x) { return esc(x.nome); }).join(', ') + '</span></div>' : '') +
      '<button class="btn btn-ink" style="height:52px" data-acao="copiar">Copiar resumo pro WhatsApp</button>' +
      '</div></div>';
  }

  function menu() {
    var itens = [['inicio', 'casa', 'Início'], ['encontro', 'agenda', 'Encontro'], ['oracao', 'coracao', 'Oração'], ['celebrar', 'estrela', 'Celebrar'], ['jornada', 'chama', 'Jornada']];
    return '<nav class="menu" aria-label="Navegação principal"><div class="in">' + itens.map(function (i) {
      var pronto = i[0] === 'inicio' || i[0] === 'encontro';
      return '<button class="' + (S.tela === i[0] ? 'ativo' : '') + (pronto ? '' : ' off') + '" data-acao="' + (pronto ? 'ir' : 'embreve') + '" data-tela="' + i[0] + '"' + (S.tela === i[0] ? ' aria-current="page"' : '') + '>' + ic(i[1]) + i[2].toUpperCase() + '</button>';
    }).join('') + '</div></nav>';
  }

  /* ---------------- Desenho geral ---------------- */
  function render() {
    if (!API) { app.innerHTML = telaSemConfig(); return; }
    if (!S.token) {
      if (S.nomes === null) carregarNomes();
      app.innerHTML = S.modo === 'cadastro' ? telaCadastro() : (S.modo === 'aguardando' ? telaAguardando() : telaEntrar());
      return;
    }
    if (!S.dados) {
      app.innerHTML = '<div class="carregando">' + AMPULHETA.replace('width="56" height="56"', 'width="96" height="96"') + '</div>';
      return;
    }
    if (S.tela === 'lider' && S.dados.eu.funcao === 'lider') { app.innerHTML = telaLider(); return; }
    app.innerHTML = (S.tela === 'encontro' ? telaEncontro() : telaInicio()) + menu();
  }

  function carregarNomes() {
    if (S.buscandoNomes) return;
    S.nomes = null; S.buscandoNomes = true;
    api('nomes').then(function (n) { S.buscandoNomes = false; S.nomes = n; render(); }, function (e) { S.buscandoNomes = false; S.nomes = []; S.erro = e.message; render(); });
  }
  function carregarPainel(silencioso) {
    if (!S.token) return;
    return api('painel').then(function (d) { S.dados = d; render(); }, function (e) { if (!silencioso) toast(e.message); if (!S.dados) render(); });
  }
  function acaoPainel(acao, extra, msg) {
    if (S.ocupado) return;
    S.ocupado = true;
    return api(acao, extra).then(function (d) { S.dados = d; S.ocupado = false; render(); if (msg) toast(msg); },
      function (e) { S.ocupado = false; toast(e.message); });
  }

  var ACOES = {
    'ir-cadastro': function () { S.modo = 'cadastro'; S.erro = ''; render(); },
    'ir-entrar': function () { S.modo = 'entrar'; S.erro = ''; S.nomes = null; render(); },
    casado: function (el) { lerCadastro(); S.cad.casado = el.dataset.v; render(); },
    ir: function (el) { S.tela = el.dataset.tela; render(); window.scrollTo(0, 0); },
    embreve: function () { toast('Chega na próxima etapa do app.'); },
    sair: function () { sair(); },
    li: function () { guardar('kairos_li_' + new Date().toDateString(), '1'); render(); toast('Boa! Palavra lida hoje.'); },
    presenca: function (el) {
      var v = el.dataset.v === S.dados.presenca.minha ? '' : el.dataset.v;
      acaoPainel('presenca', { resposta: v }, v === 'sim' ? 'Lugar guardado!' : (v === 'nao' ? 'Tudo bem, vamos sentir sua falta.' : 'Resposta desfeita.'));
    },
    aprovar: function (el) { acaoPainel('aprovar', { id: el.dataset.id, aprovar: el.dataset.v === '1' }, el.dataset.v === '1' ? 'Aprovado!' : 'Pedido recusado.'); },
    copiar: function () { copiar(resumoWhats()); }
  };

  function lerCadastro() {
    var f = document.querySelector('form[data-form="cadastro"]');
    if (!f) return;
    ['nome', 'whatsapp', 'aniversario', 'conjugeId'].forEach(function (k) { if (f.elements[k]) S.cad[k] = f.elements[k].value; });
  }

  function resumoWhats() {
    var d = S.dados, r = resumoEncontro(d);
    var vai = d.presenca.lista.filter(function (x) { return x.resposta === 'sim'; }).map(function (x) { return primeiroNome(x.nome); });
    var linhas = ['*GC ' + d.gc.nome + ' · ' + DIAS_LONGO[r.dia] + ', ' + dataBR(d.encontro.data) + ', ' + horaCurta(d.gc.hora) + '*', d.gc.local + ' · ' + d.gc.bairro, '', '*Roteiro*'];
    d.papeis.forEach(function (p) { linhas.push(p.papel + ': ' + (p.nome ? primeiroNome(p.nome) : 'a definir')); });
    linhas.push('', '*Confirmados (' + vai.length + '/' + d.presenca.total + ')*: ' + (vai.join(', ') || 'ninguém ainda'));
    if (d.lanche.length) linhas.push('', '*Lanche*', d.lanche.map(function (x) { return primeiroNome(x.nome) + ': ' + [x.comida, x.bebida].filter(Boolean).join(' + '); }).join('\n'));
    linhas.push('', 'Marque sua presença no app do Kairós.');
    return linhas.join('\n');
  }
  function copiar(texto) {
    var ok = function () { toast('Resumo copiado. É só colar no WhatsApp.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, function () { copiarVelho(texto); ok(); });
    else { copiarVelho(texto); ok(); }
  }
  function copiarVelho(texto) {
    var t = document.createElement('textarea'); t.value = texto; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-acao]');
    if (!el || el.disabled) return;
    var f = ACOES[el.dataset.acao];
    if (f) { e.preventDefault(); f(el); }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.papel) acaoPainel('papel', { papel: el.dataset.papel, membroId: el.value }, 'Papel salvo.');
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.mascara === 'ddmm') {
      var v = el.value.replace(/\D/g, '').slice(0, 4);
      el.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v;
    }
    if (el.name === 'pin') el.value = el.value.replace(/\D/g, '').slice(0, 4);
  });

  document.addEventListener('submit', function (e) {
    var f = e.target, tipo = f.dataset.form;
    if (!tipo) return;
    e.preventDefault();
    if (S.ocupado) return;
    var v = {};
    Array.prototype.forEach.call(f.elements, function (el) { if (el.name) v[el.name] = el.value; });
    if (tipo === 'entrar') {
      S.ocupado = true; S.erro = ''; render();
      api('entrar', { id: v.id, pin: v.pin }).then(function (d) {
        S.ocupado = false; S.token = d.token; guardar('kairos_token', d.token); guardar('kairos_ultimo', v.id); S.tela = 'inicio'; render(); carregarPainel();
      }, function (err) { S.ocupado = false; S.erro = err.message; render(); });
    } else if (tipo === 'cadastro') {
      lerCadastro();
      S.ocupado = true; S.erro = ''; render();
      api('cadastrar', { nome: v.nome, whatsapp: v.whatsapp, aniversario: v.aniversario, casado: S.cad.casado, conjugeId: v.conjugeId || '', pin: v.pin }).then(function (d) {
        S.ocupado = false; S.cad = { casado: 'nao' };
        if (d.status === 'ativo') { S.token = d.token; guardar('kairos_token', d.token); S.tela = 'inicio'; render(); carregarPainel(); toast('Perfil criado. Você é o líder do GC.'); }
        else { S.modo = 'aguardando'; render(); }
      }, function (err) { S.ocupado = false; S.erro = err.message; render(); });
    } else if (tipo === 'lanche') {
      acaoPainel('lanche', { comida: v.comida, bebida: v.bebida }, 'Lanche salvo!');
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.token && S.dados) carregarPainel(true);
  });

  render();
  if (S.token && API) carregarPainel();
})();
</script>
</body>
</html>
